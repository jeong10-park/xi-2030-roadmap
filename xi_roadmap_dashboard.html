<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Xi 2030 브랜드 중장기 전략 로드맵 대시보드</title>
<style>
:root{
  --bg:#f2f4f7; --panel:#fff; --line:#e3e6ec; --txt:#101828; --sub:#667085;
  --navy:#0b2047; --navy2:#16325c; --gold:#b99a5b;
  --aq:#12356b; --aq-bg:#eaeff8;
  --tu:#8a6a33; --tu-bg:#f7f1e3;
  --al:#1f6f62; --al-bg:#e8f2ef;
  --gray:#98a2b3;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--txt);font-size:13px}
header{background:linear-gradient(90deg,#0b2047 0%,#16325c 62%,#1d4076 100%);border-bottom:2px solid var(--gold);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex:0 0 auto;z-index:50}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.2px}
header .sp{flex:1}
.btn{background:rgba(255,255,255,.13);color:#fff;border:0;border-radius:6px;padding:7px 11px;font-size:12px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.24)}
.btn.primary{background:var(--gold);color:#17233c;font-weight:700}.btn.primary:hover{background:#c9ab6c}
.btn.ghost{background:transparent;border:1px solid #4b5563}
.wrap{padding:16px 20px 200px;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:11px;color:var(--sub);margin-bottom:6px}
.kpi .v{font-size:20px;font-weight:700}
.kpi .v small{font-size:12px;color:var(--sub);font-weight:500}
.bar{height:6px;background:#eef0f3;border-radius:99px;overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--aq)}
.pc-done{background:#2563eb !important}.pc-high{background:#16a34a !important}.pc-mid{background:#f59e0b !important}.pc-low{background:#dc2626 !important}
.card.pl-done{border-left-color:#2563eb !important}.card.pl-high{border-left-color:#16a34a !important}.card.pl-mid{border-left-color:#f59e0b !important}.card.pl-low{border-left-color:#dc2626 !important}
.caret{display:inline-block;width:0;height:0;border-left:6px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;margin-right:6px;vertical-align:1px}
.caret.open{transform:rotate(90deg)}
.lgd{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--sub);margin-left:auto}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select,.toolbar input[type=text]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;background:#fff;color:var(--txt)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:12px;font-weight:600;color:var(--sub)}
.tab.on{background:#111827;border-color:#111827;color:#fff}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
/* timeline */
.tl-head{display:grid;grid-template-columns:repeat(3,1fr);background:linear-gradient(90deg,#0b2047,#16325c);border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:30;box-shadow:0 2px 6px rgba(16,24,40,.18)}
.tl-head > div{padding:14px 16px;font-size:17px;font-weight:800;letter-spacing:-.3px;color:#fff;border-left:1px solid rgba(255,255,255,.16)}
.tl-head > div:first-child{border-left:0}
.tl-head small{display:block;font-size:11px;font-weight:600;color:#d8c69c;margin-top:4px;letter-spacing:.3px;text-transform:uppercase}
.pillar{border-top:1px solid var(--line)}
.pillar-h{display:flex;align-items:center;gap:8px;padding:9px 12px;font-weight:800;font-size:13px;cursor:pointer;user-select:none;position:relative;z-index:1}
.pillar.AQ .pillar-h{background:var(--aq-bg);color:var(--aq)}
.pillar.TU .pillar-h{background:var(--tu-bg);color:var(--tu)}
.pillar.AL .pillar-h{background:var(--al-bg);color:var(--al)}
.axis-h{background:linear-gradient(90deg,#f6f8fb,#fff);border-top:1px solid var(--line)}
.mini{margin-left:8px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:10px;color:#4b5563;cursor:pointer;font-weight:600}
.mini:hover{background:#f3f4f6;color:#111827}
.row.newline .cell:empty::after{content:"여기로 과제를 드래그";color:#c3c8d0;font-size:11px;font-style:italic}
.row.newline .cell:empty{align-items:center;justify-content:center}
.axis-h .t{padding:7px 12px;font-weight:700;font-size:12px;color:#374151;cursor:pointer;user-select:none}
.axis-h .t:hover{background:#f3f4f6;color:#111827}
.row{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #f0f1f3;position:relative}
.row:hover{background:#fbfcfe}
.row .lbl{padding:10px 12px;font-size:11px;color:#4b5563;line-height:1.4;border-right:1px solid var(--line)}
.row .lbl b{display:block;font-size:11px;color:#111827}
.row .lbl span{color:var(--sub)}
.cell{padding:8px;border-left:1px solid #f0f1f3;min-height:52px;display:flex;flex-direction:column;gap:6px}
.cell.drop{background:#eff6ff;outline:2px dashed #93c5fd;outline-offset:-4px}
.conn{position:absolute;left:8px;right:6px;top:50%;height:0;border-top:2px dashed #cbd5e1;z-index:0}
.card{position:relative;z-index:1;background:#fff;border:1px solid var(--line);border-left-width:3px;border-radius:8px;padding:7px 9px;cursor:grab;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card:hover{border-color:#9ca3af}
.card.AQ{border-left-color:var(--aq)}.card.TU{border-left-color:var(--tu)}.card.AL{border-left-color:var(--al)}
.card .n{font-size:12px;font-weight:600;line-height:1.35;margin-bottom:5px}
.card .meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:10px;color:var(--sub)}
.chip{background:#f3f4f6;border-radius:4px;padding:1px 5px;font-size:10px;color:#4b5563;white-space:nowrap}
.chip.s{font-weight:700}
.st-미착수{background:#f3f4f6;color:#6b7280}
.st-진행중{background:#dbeafe;color:#1d4ed8}
.st-지연{background:#fee2e2;color:#b91c1c}
.st-보류{background:#fef3c7;color:#92400e}
.st-완료{background:#d1fae5;color:#047857}
.card .bar{margin-top:6px;height:5px}
.card.goal{background:#111827;color:#fff;border-color:#111827}
.card.goal .n{color:#fff;font-weight:700}
.card.goal .meta,.card.goal .chip{color:#e5e7eb;background:rgba(255,255,255,.12)}
/* table */
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;font-size:12px;vertical-align:middle}
th{background:#f9fafb;font-size:11px;color:var(--sub);position:sticky;top:0;z-index:10;cursor:pointer;white-space:nowrap}
td input[type=number]{width:62px;border:1px solid var(--line);border-radius:5px;padding:3px 5px;font-size:12px}
td select{border:1px solid var(--line);border-radius:5px;padding:3px 5px;font-size:12px}
td input[type=text]{width:100%;border:1px solid transparent;border-radius:5px;padding:3px 5px;font-size:12px;background:transparent}
td input[type=text]:focus{border-color:var(--line);background:#fff}
/* board */
.board{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;padding:12px;align-items:start}
.col .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;align-content:start}
@media (max-width:900px){.board{grid-template-columns:repeat(4,1fr)}}
.col{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:10px}
.col h4{margin:0 0 4px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.col .sum{font-size:10px;color:var(--sub);margin-bottom:8px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:18px 20px}
.modal h3{margin:0 0 14px;font-size:15px}
.f{margin-bottom:11px}
.f label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;font-weight:600}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px;font-family:inherit}
.f textarea{min-height:64px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mrow{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.hint{font-size:11px;color:var(--sub);line-height:1.6}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin:10px 0 0}
.legend i{display:inline-block;width:18px;border-top:2px dashed #cbd5e1;vertical-align:middle;margin-right:4px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:12px}
.chart{border:1px solid var(--line);border-radius:10px;padding:12px}
.chart h4{margin:0 0 10px;font-size:12px}
.chart.wide{grid-column:1/-1}
.csec{font-weight:800;color:var(--navy);font-size:12px;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.csec:first-of-type{margin-top:0}
.crow{display:grid;grid-template-columns:130px 1fr 46px;gap:8px;align-items:center;margin-bottom:6px;font-size:11px}
.crow .cb{height:14px;background:#eef0f3;border-radius:4px;overflow:hidden}
.crow .cb > i{display:block;height:100%;background:var(--aq)}
.muted{color:var(--sub)}

.rowdel{position:absolute;right:6px;top:6px;z-index:6;background:#fff;border:1px solid var(--line);color:#98a2b3;border-radius:5px;font-size:10px;line-height:1;padding:4px 7px;cursor:pointer;opacity:0;transition:opacity .12s;font-weight:600}
.row:hover .rowdel{opacity:1}
.rowdel:hover{background:#fee4e2;color:#b42318;border-color:#fda29b}
.axno{display:inline-block;min-width:24px;color:var(--gold);font-weight:800;font-size:11px}
#mask2{z-index:130}
#hmask{z-index:140}
.cstate{font-size:11px;color:#667085;padding:3px 9px;border-radius:99px;background:#eef1f6;border:1px solid var(--line);white-space:nowrap}
.cstate.ok{background:#e7f5ef;color:#16795c;border-color:#b7e2d1}
.cstate.err{background:#fee4e2;color:#b42318;border-color:#fda29b}
.cstate.busy{background:#fdf4e3;color:#8a6a33;border-color:#eddcb8}
#whoInput{width:92px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:11px;font-family:inherit}
.hitem .ha{color:#667085;font-size:11px;min-width:74px}
.hitem .hact{font-weight:700;min-width:52px}
.hact.ins{color:#16795c}.hact.upd{color:#16325c}.hact.del{color:#b42318}.hact.res{color:#8a6a33}
.hlist{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.hitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--line);font-size:12px}
.hitem:last-child{border-bottom:none}
.hitem .ht{color:#667085;font-size:11px;min-width:118px}
.hitem .hl{flex:1;color:#1d2939}
.hitem .hnow{color:var(--gold);font-weight:800}
.btn.mini{padding:3px 9px;font-size:11px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.dtl{white-space:pre-wrap;background:#f7f8fb;border:1px solid var(--line);border-radius:8px;padding:10px 11px;font-size:12px;line-height:1.6;color:#344054}
</style>
</head>
<body>
<header>
  <h1>🏗️ Xi 2030 브랜드 중장기 전략 로드맵</h1>
  <span class="muted" id="saveState" style="font-size:11px;color:#9ca3af"></span>
  <span class="sp"></span>
  <button class="btn primary" id="addBtn">+ 과제 추가</button>
  <button class="btn ghost" id="undoBtn" title="실행 취소 (Ctrl+Z)">↶ 실행 취소</button>
  <button class="btn ghost" id="redoBtn" title="다시 실행 (Ctrl+Shift+Z)">↷ 다시 실행</button>
  <button class="btn ghost" id="histBtn">🕘 변경 이력</button>
  <input id="whoInput" placeholder="이름" title="변경 이력에 기록될 이름" />
  <button class="btn primary" id="cloudSave">☁️ DB 저장</button>
  <button class="btn ghost" id="cloudPullBtn">↻ 불러오기</button>
  <button class="btn ghost" id="dbHistBtn">🗄 DB 이력</button>
  <span class="cstate" id="cloudState">로컬 모드</span>
  <button class="btn" id="expCsv">CSV 저장</button>
  <button class="btn" id="expJson">JSON 저장</button>
  <button class="btn ghost" id="impBtn">불러오기</button>
  <button class="btn ghost" id="resetBtn">초기화</button>
  <input type="file" id="impFile" accept=".json" style="display:none" />
</header>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="toolbar">
    <span class="lgd"><span><i style="background:#2563eb"></i>완료</span><span><i style="background:#16a34a"></i>70% 이상</span><span><i style="background:#f59e0b"></i>40% 이상</span><span><i style="background:#dc2626"></i>40% 미만</span></span>
    <select id="fPillar"></select>
    <select id="fAxis"></select>
    <select id="fTeam"></select>
    <select id="fStage"></select>
    <select id="fStatus"></select>
    <input type="text" id="fQ" placeholder="과제명 검색" style="min-width:180px" />
    <button class="btn ghost" id="clearF" style="color:#374151;border-color:#d1d5db">필터 해제</button>
    <span class="sp" style="flex:1"></span>
    <span class="muted" id="cnt"></span>
  </div>
  <div class="tabs">
    <div class="tab on" data-v="timeline">🗓 타임라인</div>
    <div class="tab" data-v="team">👥 팀별 보드</div>
    <div class="tab" data-v="status">🚦 진행상태 보드</div>
    <div class="tab" data-v="table">📋 전체 테이블</div>
    <div class="tab" data-v="chart">📊 진척 현황</div>
  </div>
  <div class="panel" id="view"></div>
  <div class="legend">
    <span><i></i>점선 = 같은 라인으로 연결된 연속 과제 (단계가 달라도 하나의 흐름)</span>
    <span>카드를 드래그하면 단계·라인 이동, 클릭하면 상세 편집</span>
    <span>DB 연결 시 변경은 자동 저장되며 20초마다 다른 사람의 변경을 불러옵니다</span>
  </div>
</div>

<div class="mask" id="hmask">
  <div class="modal" style="width:min(640px,100%)">
    <h3>🕘 변경 이력</h3>
    <div style="font-size:11px;color:#667085;margin-bottom:10px">각 항목을 선택하면 그 변경 직전 상태로 되돌립니다. (최근 50개 보관)</div>
    <div class="hlist" id="hList"></div>
    <div class="mrow" style="margin-top:12px"><button class="btn ghost" id="hClear" style="color:#b42318;border-color:#fda29b">이력 비우기</button><button class="btn primary" id="hClose">닫기</button></div>
  </div>
</div>

<div class="mask" id="mask2">
  <div class="modal" style="width:min(430px,100%)">
    <h3 id="m2Title">확인</h3>
    <div class="f" id="m2Wrap"><label id="m2Label"></label><input type="text" id="m2Input" /></div>
    <div id="m2Msg" style="font-size:12px;color:#344054;line-height:1.6;margin-bottom:12px"></div>
    <div class="mrow"><div></div><div style="display:flex;gap:8px">
      <button class="btn ghost" id="m2Cancel" style="color:#344054;border-color:#d0d5dd">추소</button>
      <button class="btn primary" id="m2Ok">확인</button>
    </div></div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <h3 id="mTitle">과제 편집</h3>
    <div class="f"><label>과제명</label><input type="text" id="m_n" /></div>
    <div class="f f2">
      <div><label>핵심과제</label><select id="m_p"></select></div>
      <div><label>실행축</label><input type="text" id="m_a" list="axisList" /><datalist id="axisList"></datalist></div>
    </div>
    <div class="f f2">
      <div><label>단계</label><select id="m_s"></select></div>
      <div><label>유형</label><select id="m_t"><option value="task">실행과제</option><option value="goal">2030 목표</option></select></div>
    </div>
    <div class="f f2">
      <div><label>과제라인 (같은 값끼리 한 줄에 연결)</label><input type="text" id="m_l" list="lineList" /><datalist id="lineList"></datalist></div>
      <div><label>라인 순서 (예: 1/3)</label><input type="text" id="m_o" /></div>
    </div>
    <div class="f"><label>담당팀 (쉼표로 구분)</label><input type="text" id="m_m" /></div>
    <div class="f"><label>상세 내용 (제안서 원문 · 편집 가능)</label><textarea id="m_desc" rows="6"></textarea></div>
    <div class="f f2">
      <div><label>진행상태</label><select id="m_status"></select></div>
      <div><label>진척률 (%)</label><input type="number" id="m_prog" min="0" max="100" step="5" /></div>
    </div>
    <div class="f f2">
      <div><label>담당자</label><input type="text" id="m_owner" /></div>
      <div><label>연속과제</label><select id="m_c"><option value="true">연결 (연속)</option><option value="false">단독</option></select></div>
    </div>
    <div class="f"><label>진행 메모</label><textarea id="m_note"></textarea></div>
    <div class="f f2">
      <div><label>추진 시작일</label><input type="date" id="m_start" /></div>
      <div><label>추진 종료일</label><input type="date" id="m_end" /></div>
    </div>
    <div class="mrow">
      <button class="btn" id="mDel" style="background:#fee2e2;color:#b91c1c">삭제</button>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" id="mCancel" style="color:#374151;border-color:#d1d5db">취소</button>
        <button class="btn primary" id="mSave">저장</button>
      </div>
    </div>
  </div>

function seed(){
  return SEED.map((r,i)=>({
    id:"t"+i, n:r.n, p:r.p, a:r.a, s:r.s, t:r.t, l:r.l||"", o:r.o||"", c:!!r.c,
    m:(r.m||[]).slice(), status:r.t==="goal"?"":"미착수", prog:0, note:"", owner:"",
    start:STAGE_DATE[r.s][0], end:STAGE_DATE[r.s][1], ord:i
  }));

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); if(Array.isArray(d.extraLines)) extraLines = d.extraLines; if(Array.isArray(d.tasks) && d.tasks.length){ tasks = d.tasks; stamp(d.at); prevState = snapshot(); loadHist(); updateHistUI(); return; } }
  }catch(e){}
  tasks = seed(); prevState = snapshot(); persist(); loadHist(); updateHistUI();
}
function snapshot(){ return JSON.stringify({tasks, extraLines}); }
function applyState(js){ try{ const d = JSON.parse(js); tasks = d.tasks || []; extraLines = d.extraLines || []; return true; }catch(e){ return false; } }
function saveHist(){ try{ localStorage.setItem(HKEY, JSON.stringify(hist.slice(-50))); }catch(e){} }
function loadHist(){ try{ const r = localStorage.getItem(HKEY); if(r){ const d = JSON.parse(r); if(Array.isArray(d)) hist = d; } }catch(e){} }
function persist(){
  const at = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify({at, tasks, extraLines})); }catch(e){}
  stamp(at);
}
function save(label){
  const cur = snapshot();
  if(prevState != null && cur !== prevState){
    hist.push({at: new Date().toISOString(), label: label || "변경", state: prevState});
    while(hist.length > 50) hist.shift();
    redoStack = [];
    saveHist();
  }
  prevState = cur;
  persist();
  updateHistUI();
  if(CLOUD){ dirty = true; setCloud("● 저장 대기", "busy"); clearTimeout(pushTimer); pushTimer = setTimeout(cloudPush, 1800); }
}
function updateHistUI(){
  const u = document.getElementById("undoBtn"), r = document.getElementById("redoBtn"), h = document.getElementById("histBtn");
  if(u) u.disabled = !hist.length;
  if(r) r.disabled = !redoStack.length;
  if(h) h.textContent = "🕘 변경 이력" + (hist.length ? " (" + hist.length + ")" : "");
  if(document.getElementById("hmask") && document.getElementById("hmask").classList.contains("on")) renderHist();
}
function undo(){
  if(!hist.length) return;
  const e = hist.pop();
  redoStack.push({at: new Date().toISOString(), label: e.label, state: snapshot()});
  applyState(e.state); prevState = snapshot(); persist(); saveHist(); updateHistUI(); render();
}
function redo(){
  if(!redoStack.length) return;
  const e = redoStack.pop();
  hist.push({at: new Date().toISOString(), label: e.label, state: snapshot()});
  applyState(e.state); prevState = snapshot(); persist(); saveHist(); updateHistUI(); render();
}
function restoreTo(i){
  const e = hist[i]; if(!e) return;
  hist.push({at: new Date().toISOString(), label: "이력 복원 직전 상태", state: snapshot()});
  while(hist.length > 50) hist.shift();
  applyState(e.state); prevState = snapshot(); persist(); saveHist(); redoStack = []; updateHistUI(); render();
}
function renderHist(){
  const box = document.getElementById("hList"); if(!box) return;
  if(!hist.length){ box.innerHTML = '<div class="hitem"><div class="hl" style="color:#98a2b3">아직 변경 이력이 없습니다.</div></div>'; return; }
  let html = '<div class="hitem"><div class="ht">현재</div><div class="hl hnow">현재 상태</div><div></div></div>';
  for(let i = hist.length - 1; i >= 0; i--){
    const e = hist[i];
    html += '<div class="hitem"><div class="ht">' + esc(new Date(e.at).toLocaleString("ko-KR")) + '</div><div class="hl">' + esc(e.label || "변경") + '</div><button class="btn mini" data-hrestore="' + i + '">이 시점으로</button></div>';
  }

}
function stamp(at){
  document.getElementById("saveState").textContent = at ? ("최근 저장 " + new Date(at).toLocaleString("ko-KR")) : "";

const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uniq = a => [...new Set(a)].filter(x=>x!==""&&x!=null);
const allTeams = () => uniq(tasks.flatMap(t=>t.m)).sort();
const allAxes = () => uniq(tasks.map(t=>t.a));
const allLines = () => uniq(tasks.map(t=>t.l)).sort();

function filters(){
  return {p:v("fPillar"), a:v("fAxis"), team:v("fTeam"), s:v("fStage"), st:v("fStatus"), q:(v("fQ")||"").trim().toLowerCase()};
}
function v(id){ const e=document.getElementById(id); return e? e.value : ""; }
function match(t){
  const f = filters();
  if(f.p && t.p!==f.p) return false;
  if(f.a && t.a!==f.a) return false;
  if(f.team && !(t.m||[]).includes(f.team)) return false;
  if(f.s && t.s!==f.s) return false;
  if(f.st && t.status!==f.st) return false;
  if(f.q && !t.n.toLowerCase().includes(f.q)) return false;
  return true;
}

function pcls(t){ var g=+t.prog||0; if(t.status==="완료"||g>=100) return "done"; if(g>=70) return "high"; if(g>=40) return "mid"; return "low"; }

function renderBoard(by){
  const rows = tasks.filter(match).filter(t=>t.t==="task");
  let groups;
  if(by==="team"){
    groups = allTeams().map(tm=>[tm, rows.filter(t=>(t.m||[]).includes(tm))]);
    const none = rows.filter(t=>!(t.m||[]).length); if(none.length) groups.push(["팀 미지정", none]);
  } else {
    groups = STATUSES.map(s=>[s, rows.filter(t=>t.status===s)]);
  }
  return '<div class="board">' + groups.filter(g=>g[1].length).map(g=>{
    const avg = g[1].length? Math.round(g[1].reduce((s,x)=>s+(+x.prog||0),0)/g[1].length):0;
    const span = Math.max(3, Math.min(12, Math.ceil(g[1].length/6)*3));
    return '<div class="col" style="grid-column:span '+span+'"><h4>'+esc(g[0])+' <span class="muted">'+g[1].length+'</span></h4>'
      + '<div class="sum">평균 진척률 '+avg+'%</div><div class="bar" style="margin-bottom:10px"><i style="width:'+avg+'%"></i></div>'
      + '<div class="list" data-drop-'+(by==="team"?"team":"status")+'="'+esc(g[0])+'">'+g[1].map(card).join("")+'</div></div>';
  }).join("") + '</div>';
}

  let h = '<div style="overflow:auto"><table><thead><tr>' + cols.map(c=>'<th data-sort="'+c[0]+'">'+c[1]+(sortKey===c[0]?(sortDir>0?" ▲":" ▼"):"")+'</th>').join("") + '<th></th></tr></thead><tbody>';

      + '<td>'+(t.m||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join(" ")+'</td>'
      + '<td>'+(t.t==="goal"?'<span class="muted">—</span>':'<select data-f="status">'+STATUSES.map(s=>'<option value="'+s+'"'+(t.status===s?" selected":"")+'>'+s+'</option>').join("")+'</select>')+'</td>'
      + '<td>'+(t.t==="goal"?'<span class="muted">—</span>':'<input type="number" data-f="prog" min="0" max="100" step="5" value="'+(+t.prog||0)+'" />')+'</td>'
      + '<td><input type="text" data-f="owner" value="'+esc(t.owner)+'" placeholder="—" /></td>'
      + '<td><input type="text" data-f="note" value="'+esc(t.note)+'" placeholder="메모 입력" /></td>'
      + '<td><button class="btn ghost" style="color:#374151;border-color:#d1d5db;padding:4px 8px" data-edit="'+t.id+'">편집</button></td></tr>';
  }
  return h + '</tbody></table></div>';
}
function axisBlock(rows){
  var out = '<div class="chart wide"><h4>실행축 별 평균 진척률</h4>';
  Object.keys(PILLARS).forEach(function(pk){
    var sub = rows.filter(function(t){ return t.p===pk; });
    var mm = new Map();
    sub.forEach(function(t){ if(!t.a) return; if(!mm.has(t.a)) mm.set(t.a,[]); mm.get(t.a).push(t); });
    var ents = [...mm.entries()].sort(function(a,b){ return axIdx(pk,a[0])-axIdx(pk,b[0]); });
    if(!ents.length) return;
    out += '<div class="csec">' + esc(PILLARS[pk]) + '</div>';
    ents.forEach(function(e){
      var avg = Math.round(e[1].reduce(function(x,y){ return x+(+y.prog||0); },0)/e[1].length);
      out += '<div class="crow"><div>' + esc(e[0]) + '</div><div class="cb"><i style="width:'+avg+'%"></i></div><div style="text-align:right;font-weight:700">'+avg+'%</div></div>';
    });
  });
  return out + '</div>';
}
function renderChart(){
  const rows = tasks.filter(match).filter(t=>t.t==="task");
  const grp = (keyFn)=>{
    const m = new Map();
    rows.forEach(t=>{ const ks = keyFn(t); (Array.isArray(ks)?ks:[ks]).forEach(k=>{ if(!k) return; if(!m.has(k)) m.set(k,[]); m.get(k).push(t); }); });
    return [...m.entries()];
  };
  const block = (title, entries, mode) => '<div class="chart"><h4>'+title+'</h4>' + entries.sort((a,b)=> mode==="cnt" ? b[1].length-a[1].length : 0).map(e=>{
    const avg = Math.round(e[1].reduce((s,x)=>s+(+x.prog||0),0)/e[1].length);
    const val = mode==="cnt" ? e[1].length : avg;
    const max = mode==="cnt" ? Math.max(...entries.map(x=>x[1].length)) : 100;
    return '<div class="crow"><div>'+esc(e[0])+'</div><div class="cb"><i style="width:'+(max?val/max*100:0)+'%"></i></div><div style="text-align:right;font-weight:700">'+val+(mode==="cnt"?"":"%")+'</div></div>';
  }).join("") + '</div>';
  return '<div class="charts">'
    + block("핵심과제별 평균 진척률", grp(t=>PILLARS[t.p]), "avg")
    + axisBlock(rows)
    + block("단계별 평균 진척률", grp(t=>STAGE_LABEL[t.s]), "avg")
    + block("팀별 과제 수", grp(t=>t.m), "cnt")
    + block("팀별 평균 진척률", grp(t=>t.m), "avg")
    + block("진행상태 분포", grp(t=>t.status), "cnt")
    + '</div>';
}

    n:g("n").trim()||"(제목 없음)", p:g("p"), a:g("a").trim(), s:g("s"), t:g("t"),

  };

  else { tasks.push(Object.assign({id:"t"+Date.now(), ord:tasks.length}, data)); }

function axIdx(pk,ax){ const i=(AXIS_ORDER[pk]||[]).indexOf(ax); return i<0?99:i; }
function axNo(pk,ax){ const i=(AXIS_ORDER[pk]||[]).indexOf(ax); return i<0?"":("0"+(i+1)).slice(-2)+")"; }
function nkey(x){ return String(x||"").toLowerCase().replace(/[^0-9a-z\uac00-\ud7a3]/g,""); }
function detailOf(t){
  if(!t) return "";
  if(t.desc) return t.desc;
  const k = nkey(t.n); if(!k) return "";
  if(DETAILS[k]) return DETAILS[k];
  let best="", bl=0;
  for(const kk in DETAILS){ if(kk.length>8 && (kk.indexOf(k)>=0 || k.indexOf(kk)>=0) && kk.length>bl){ best=DETAILS[kk]; bl=kk.length; } }
  return best;
}

/* ===================== Supabase 데이터 계층 ===================== */
function setCloud(msg, cls){
  const e = document.getElementById("cloudState");
  if(e){ e.textContent = msg; e.className = "cstate " + (cls || ""); }
}
function sbUrl(path){ return SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/" + path; }
async function sb(path, opts){
  opts = opts || {};
  const h = Object.assign({
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  }, opts.headers || {});
  const r = await fetch(sbUrl(path), Object.assign({}, opts, {headers: h}));
  const txt = await r.text();
  if(!r.ok) throw new Error(r.status + " " + txt.slice(0, 180));
  return txt ? JSON.parse(txt) : null;
}
function rowToTask(r){
  return {id:r.task_key, n:r.name, p:r.pillar, a:r.axis || "", s:r.stage, t:r.kind || "task",
    l:r.line_code || "", o:r.order_label || "", c:!!r.continued, m:(r.teams || []).slice(),
    status:r.status || "", prog:r.progress || 0, note:r.note || "", owner:r.owner || "",
    start:r.start_date || "", end:r.end_date || "", ord:r.sort_order || 0, desc:r.description || ""};
}
function taskToRow(t, i){
  return {task_key:t.id, name:t.n, pillar:t.p, axis:t.a || "", stage:t.s, kind:t.t || "task",
    line_code:t.l || "", order_label:t.o || "", continued:!!t.c, teams:(t.m || []),
    status:t.status || "", progress:Number(t.prog) || 0, owner:t.owner || "", note:t.note || "",
    start_date:t.start || null, end_date:t.end || null, sort_order:(t.ord == null ? i : t.ord),
    description:t.desc || (typeof detailOf === "function" ? (detailOf(t) || "") : ""),
    deleted_at:null, deleted_by:null, updated_by:who};
}
async function cloudPull(silent){
  if(!CLOUD || cloudBusy) return;
  cloudBusy = true; setCloud("불러오는 중…", "busy");
  try{
    const rows = await sb("roadmap_tasks?deleted_at=is.null&select=*&order=sort_order.asc&limit=2000");
    const lns = await sb("roadmap_lines?select=*");
    tasks = (rows || []).map(rowToTask);
    extraLines = (lns || []).map(x=>({p:x.pillar, a:x.axis, l:x.line_code}));
    prevState = snapshot(); dirty = false;
    persist();
    setCloud("☁️ 동기화됨 " + new Date().toLocaleTimeString("ko-KR"), "ok");
    render();
  }catch(e){
    setCloud("연결 실패: " + e.message, "err");
    if(!silent) alert("Supabase 연결에 실패했습니다.\n" + e.message);
  }
  cloudBusy = false;
}
async function cloudPush(){
  if(!CLOUD || cloudBusy) return;
  clearTimeout(pushTimer);
  cloudBusy = true; setCloud("저장 중…", "busy");
  try{
    const rows = tasks.map(taskToRow);
    for(let i = 0; i < rows.length; i += 200){
      await sb("roadmap_tasks?on_conflict=task_key", {method:"POST",
        headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},
        body: JSON.stringify(rows.slice(i, i + 200))});
    }
    const live = await sb("roadmap_tasks?deleted_at=is.null&select=task_key&limit=2000");
    const mine = {}; tasks.forEach(t=>{ mine[t.id] = 1; });
    const gone = (live || []).map(r=>r.task_key).filter(k=>!mine[k]);
    if(gone.length){
      const inList = gone.map(k=>'"' + k + '"').join(",");
      await sb("roadmap_tasks?task_key=in.(" + encodeURIComponent(inList) + ")", {method:"PATCH",
        headers:{"Prefer":"return=minimal"},
        body: JSON.stringify({deleted_at: new Date().toISOString(), deleted_by: who, updated_by: who})});
    }
    if(extraLines.length){
      await sb("roadmap_lines?on_conflict=pillar,line_code", {method:"POST",
        headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},
        body: JSON.stringify(extraLines.map(x=>({pillar:x.p, axis:x.a, line_code:x.l, created_by:who})))});
    }
    const cur = await sb("roadmap_lines?select=pillar,line_code");
    const keep = {}; extraLines.forEach(x=>{ keep[x.p + "|" + x.l] = 1; });
    for(const r of (cur || [])){
      if(!keep[r.pillar + "|" + r.line_code]){
        await sb("roadmap_lines?pillar=eq." + encodeURIComponent(r.pillar) + "&line_code=eq." + encodeURIComponent(r.line_code),
          {method:"DELETE", headers:{"Prefer":"return=minimal"}});
      }
    }
    dirty = false;
    setCloud("☁️ 저장 완료 " + new Date().toLocaleTimeString("ko-KR"), "ok");
  }catch(e){
    setCloud("저장 실패: " + e.message, "err");
  }
  cloudBusy = false;
}
const ACT_LABEL = {insert:["추가","ins"], update:["수정","upd"], delete:["삭제","del"], restore:["복원","res"]};
async function renderServerHist(){
  const box = document.getElementById("hList"); if(!box) return;
  box.innerHTML = '<div class="hitem"><div class="hl">불러오는 중…</div></div>';
  try{
    const rs = await sb("roadmap_history?select=id,task_key,action,changed,actor,at,before_row&order=at.desc&limit=100");
    if(!rs || !rs.length){ box.innerHTML = '<div class="hitem"><div class="hl" style="color:#98a2b3">서버 변경 이력이 없습니다.</div></div>'; return; }
    let html = "";
    for(const r of rs){
      const al = ACT_LABEL[r.action] || [r.action, "upd"];
      const nm = (r.before_row && r.before_row.name) ? r.before_row.name : (r.task_key || "");
      html += '<div class="hitem">'
        + '<div class="ht">' + esc(new Date(r.at).toLocaleString("ko-KR")) + '</div>'
        + '<div class="hact ' + al[1] + '">' + al[0] + '</div>'
        + '<div class="ha">' + esc(r.actor || "-") + '</div>'
        + '<div class="hl">' + esc(nm) + (r.changed ? ' <span style="color:#98a2b3">· ' + esc(r.changed) + '</span>' : "") + '</div>'
        + (r.before_row ? '<button class="btn mini ghost" data-srestore="' + r.id + '">되돌리기</button>' : '<div></div>')
        + '</div>';
    }
    box.innerHTML = html;
  }catch(e){
    box.innerHTML = '<div class="hitem"><div class="hl" style="color:#b42318">불러오기 실패: ' + esc(e.message) + '</div></div>';
  }
}
async function restoreServer(id){
  try{
    const rs = await sb("roadmap_history?id=eq." + id + "&select=before_row");
    const b = rs && rs[0] && rs[0].before_row;
    if(!b){ alert("복원할 원본이 없습니다."); return; }
    delete b.id; delete b.created_at; delete b.updated_at;
    b.updated_by = (who || "") + " (이력 복원)";
    await sb("roadmap_tasks?on_conflict=task_key", {method:"POST",
      headers:{"Prefer":"resolution=merge-duplicates,return=minimal"}, body: JSON.stringify([b])});
    await cloudPull(true);
    renderServerHist();
  }catch(e){ alert("복원 실패: " + e.message); }
}
async function cloudBoot(){
  who = localStorage.getItem(WHOKEY) || "";
  const wi = document.getElementById("whoInput");
  if(wi){ wi.value = who; wi.oninput = ()=>{ who = wi.value.trim(); localStorage.setItem(WHOKEY, who); }; }
  await cloudPull(false);
  if(!tasks.length){
    tasks = seed(); prevState = snapshot();
    setCloud("초기 데이터 적재 중…", "busy");
    await cloudPush();
    render();
  }
  loadHist(); updateHistUI();
  setInterval(()=>{ if(!dirty && !cloudBusy && !document.hidden) cloudPull(true); }, 20000);
}

document.getElementById("hList").addEventListener("click", e=>{
  const sbtn = e.target.closest("[data-srestore]");
  if(sbtn){ askConfirm("이 변경 직전으로 되돌리기", "해당 과제를 이 변경 직전 상태로 되돌립니다. 되돌린 기록도 이력에 남습니다.", ()=>restoreServer(sbtn.dataset.srestore)); return; }

document.addEventListener("keydown", e=>{
  if(!(e.ctrlKey || e.metaKey)) return;
  const k = (e.key || "").toLowerCase();
  if(k === "z" && !e.shiftKey){ e.preventDefault(); undo(); }
  else if((k === "z" && e.shiftKey) || k === "y"){ e.preventDefault(); redo(); }
});
if(CLOUD){ render(); cloudBoot(); } else { load(); render(); updateHistUI(); setCloud("로컬 모드 (브라우저 저장)", ""); }
